<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="{{csp}}">
<link rel="stylesheet" href="{{cssUri}}">
</head>
<body>
<header>
  <select id="hostFilter" class="host-filter" title="Filter tunnels by host"></select>
  <button id="dirFilter" class="filter-btn" title="Direction filter — click to cycle: All → Listen Local (-L) → Listen Remote (-R)"></button>
  <button id="runFilter" class="filter-btn" title="Running filter — click to cycle: All → Running → Not running"></button>
  <input id="searchInput" type="text" placeholder="Search host, address, port" title="Search tunnels by host, address, or port">
  <span class="spacer"></span>
  <button id="addBtn" class="icon-btn" title="Forward a Port">
    <svg viewBox="0 0 16 16" fill="none"><path d="M8 2.5v11M2.5 8h11" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
  </button>
</header>
<div id="tableWrap">
  <table>
    <colgroup>
      <col style="width:150px">
      <col>
      <col style="width:90px">
      <col style="width:190px">
      <col style="width:130px">
      <col style="width:92px">
    </colgroup>
    <thead>
      <tr>
        <th class="sortable" data-sort="direction">Direction<span class="sort-ind"></span></th>
        <th class="sortable" data-sort="host">Host<span class="sort-ind"></span></th>
        <th class="sortable" data-sort="listen">Listen<span class="sort-ind"></span></th>
        <th class="sortable" data-sort="destination">Destination<span class="sort-ind"></span></th>
        <th class="sortable" data-sort="status">Status<span class="sort-ind"></span></th>
        <th></th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div id="empty" class="empty">No port forwards. Use the + button or right-click a host in the SSH Config explorer.</div>
</div>
<script src="{{scriptUri}}"></script>
</body>
</html>
